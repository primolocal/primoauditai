version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-primoaudit}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-primoaudit}
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-local}
      - HERMES_PROVIDER=${HERMES_PROVIDER:-mock}
      - HERMES_VPS_URL=${HERMES_VPS_URL}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - OLLAMA_CLOUD_API_KEY=${OLLAMA_CLOUD_API_KEY}
      - OLLAMA_CLOUD_BASE_URL=${OLLAMA_CLOUD_BASE_URL:-https://api.ollama.ai/v1}
      - OLLAMA_CLOUD_MODEL=${OLLAMA_CLOUD_MODEL:-kimi-k2.6:cloud}
      - OLLAMA_CLOUD_VISION_MODEL=${OLLAMA_CLOUD_VISION_MODEL:-glm-5.1:cloud}
      - OLLAMA_CLOUD_TIMEOUT=${OLLAMA_CLOUD_TIMEOUT:-45.0}
      - OLLAMA_CLOUD_TEMPERATURE=${OLLAMA_CLOUD_TEMPERATURE:-0.2}
    volumes:
      - ./backend/data:/app/data
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  pgdata:
