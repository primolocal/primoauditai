# Alembic configuration file for PrimoAuditAI v2

[alembic]
# Path to migration scripts
script_location = alembic

# Whether to prepend revision IDs with branch labels
prepend_sys_path = .
version_path_separator = os

[post_write_hooks]
# hooks for post-revision formatting

[logging]
# logging config

[alembic:exclude]
# Exclude tables managed by extensions (e.g., postgis, pg_stat_statements)

# SQLAlchemy database URL — loaded from env var or .env
# Set ALEMBIC_DATABASE_URL to override
[alembic:database]
url = %(ALEMBIC_DATABASE_URL)s

[handlers]
keys = console

[formatters]
keys = generic

[loggers]
keys = root,sqlalchemy,alembic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
