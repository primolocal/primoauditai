services:
  backend:
    root: backend
    build:
      builder: NIXPACKS
      nixpacksPlan:
        providers: ["python"]
        phases:
          setup:
            nixPkgs: ["python311", "postgresql"]
    deploy:
      startCommand: "uvicorn src.api.app:app --host 0.0.0.0 --port $PORT"
      healthcheckPath: "/health"
      healthcheckTimeout: 30
      restartPolicyType: "ON_FAILURE"
      restartPolicyMaxRetries: 3
    
  frontend:
    root: frontend
    build:
      builder: NIXPACKS
      nixpacksPlan:
        providers: ["node"]
        phases:
          setup:
            nixPkgs: ["nodejs_20"]
          build:
            cmds: ["npm install", "npm run build"]
    deploy:
      startCommand: "npx next start -p $PORT"
      healthcheckPath: "/"
      healthcheckTimeout: 30
      restartPolicyType: "ON_FAILURE"
      restartPolicyMaxRetries: 3
